# What a user actually writes. Compare with the old package: no boolean soup for the
# architecture, no net_h/net_w pair, losses and metrics carry an explicit name.
data:
  train_path: PLACEHOLDER_TRAIN
  validation_path: PLACEHOLDER_VALID
  mode: nested_dirs
  colormap:
    - [0, 0, 0]
    - [255, 255, 255]
  subdirs: [images, masks]

models:
  - name: unet
    architecture: u_net
    input_shape: [256, 256]
    channels: 3
    n_class: 2
    blocks: 4
    filters: 16
    dropout: 0.2
    loss:
      name: focal
      gamma: 2.0
    metrics:
      - name: iou
      - name: dice
    optimizer:
      name: adam
      learning_rate: 0.001
    callbacks:
      - name: early_stopping
        patience: 15
      - name: terminate_on_nan
    augmentation:
      - name: HorizontalFlip
        params: {p: 0.5}
      - name: RandomRotate90
        params: {p: 0.5}
    epochs: 20
    batch_size: 8

  - name: unetpp
    architecture: u_net_plus_plus
    input_shape: [256, 256]
    n_class: 2
    blocks: 3
    filters: 16
    loss:
      name: focal_tversky
      alpha: 0.7
    epochs: 20
