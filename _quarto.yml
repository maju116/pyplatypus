        - reference/SegmentationSpec.qmd
        - reference/DetectionSpec.qmd
        - reference/PlatypusSpec.qmd
        - reference/Task.qmd
        - reference/spec_schema.qmd
        - reference/write_schema.qmd
      - section: What a model is made of
