format:
  html:
    toc: true
quartodoc:
  package: pyplatypus
  dir: reference
  title: Reference
  style: pkgdown
  render_interlinks: false
  parser: google
  sections:
  - title: A specification
    desc: 'One object says what to train, on what data, with what. Built from a dict or from YAML
      - the same specification either way, and `task` decides its shape.

      '
    contents:
    - from_dict
    - from_yaml
    - SegmentationSpec
    - DetectionSpec
    - PlatypusSpec
    - Task
    - spec_schema
    - write_schema
  - title: What a model is made of
    desc: 'Losses, metrics, optimisers, callbacks and augmentation are named in the specification
      rather than constructed, so their fields are documented in the schema. This lists the transforms
      the installed albumentations offers.

      '
    contents:
    - available_transforms
  - title: The data on disk
    desc: 'Splitting by patient rather than by slice, and looking at what will actually be read
      before spending an afternoon training on it.

      '
    contents:
    - split_dataset
    - split_samples
    - Engine.dataset
    - Engine.loader
    - DetectionEngine.dataset
    - DetectionEngine.loader
  - title: Training
    desc: The engine the task asks for, and the run itself.
    contents:
    - build_engine
    - Engine
    - Engine.fit
    - DetectionEngine
    - DetectionEngine.fit
    - DetectionEngine.fit_anchors
  - title: Predicting and scoring
    desc: 'Per model, per case, per class, per image - and the distribution rather than a single
      number, because the minimum is what nobody publishes and everybody should.

      '
    contents:
    - Engine.predict
    - Engine.evaluate
    - Engine.evaluate_cases
    - summarise_cases
    - Engine.best_model
    - DetectionEngine.predict
    - DetectionEngine.evaluate
    - DetectionEngine.evaluate_classes
