# 2018 Data Science Bowl: find the nuclei.
#
# Two models, one file, one run. This is the whole point of the YAML path - and the
# identical spec can be built from arguments in R and behave the same way.

data:
  train_path: examples/data/data_science_bowl/stage1_train
  validation_path: examples/data/data_science_bowl/stage1_validation
  test_path: examples/data/data_science_bowl/stage1_test
  mode: nested_dirs
  colormap:
    - [0, 0, 0]          # background
    - [255, 255, 255]    # nucleus
  shuffle: true

output_dir: examples/output
seed: 0

models:
  - name: unet
    architecture: u_net
    input_shape: [160, 160]
    channels: 3
    n_class: 2
    blocks: 4
    filters: 16
    dropout: 0.1
    loss:
      name: cce_dice
      cce_weight: 0.5
    metrics:
      - name: dice
        include_background: false    # nuclei are a small part of the picture
      - name: iou
        include_background: false
    optimizer:
      name: adam
      learning_rate: 0.001
    callbacks:
      - name: early_stopping
        monitor: val_dice
        patience: 4
      - name: model_checkpoint
        path: examples/output/unet.pt
        monitor: val_dice
      - name: csv_logger
        path: examples/output/unet_history.csv
      - name: terminate_on_nan
    augmentation:
      - name: HorizontalFlip
        params: {p: 0.5}
      - name: VerticalFlip
        params: {p: 0.5}
      - name: RandomRotate90
        params: {p: 0.5}
    epochs: 6
    batch_size: 8

  - name: linknet
    architecture: linknet
    input_shape: [160, 160]
    channels: 3
    n_class: 2
    blocks: 4
    filters: 16
    dropout: 0.1
    loss:
      name: focal_tversky
      alpha: 0.7            # weight missed nuclei more than false alarms
      gamma: 1.3
    metrics:
      - name: dice
        include_background: false
      - name: iou
        include_background: false
    optimizer:
      name: adamw
      learning_rate: 0.001
    callbacks:
      - name: early_stopping
        monitor: val_dice
        patience: 4
      - name: model_checkpoint
        path: examples/output/linknet.pt
        monitor: val_dice
      - name: csv_logger
        path: examples/output/linknet_history.csv
    epochs: 6
    batch_size: 8
