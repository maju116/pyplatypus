name: Publish

# Tag a release and the distributions go out. Nothing is published from a branch.
#
# One-time setup on PyPI: add a trusted publisher for this repository and this workflow
# filename (Account -> Publishing). That is what replaces an API token, and why there is
# no secret here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    # A CEILING, BECAUSE WITHOUT ONE A HUNG JOB RUNS TO GITHUB'S 360-MINUTE DEFAULT.
    # `maju116/pyplatypus#457`: the reviewer's sixteenth pass saw the engine's suite deadlock
    # once at a two-worker detection test - the main process asleep, both children at zero
    # CPU, `utime` unmoved across two reads - and nothing in either repository set a timeout.
    #
    # 45 minutes is set against the WORST DAY SEEN rather than the typical one, which is the
    # mistake this figure invites in both directions: too low turns a slow runner into a
    # false red, too high is the default. Measured over the last 30 workflow runs of each
    # repository, the longest job is 11.8 minutes in `pyplatypus` and 7.6 in `rplatypus` -
    # and §7 of the workbench records `setup-r@v2` alone taking 22m55s once, OUTSIDE that
    # window, which is why the ceiling is set against that outlier rather than against the
    # sample. A sample of thirty runs understates the worst day by construction.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check dist/*
      - name: The tag has to match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tagged" = "$declared" || {
            echo "tag $tagged does not match pyproject version $declared"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: distributions, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: distributions, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
