name: CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uvx ruff@0.16.6 check pyplatypus tests
      - run: uvx ruff@0.16.6 format --check --diff pyplatypus tests
        continue-on-error: true   # formatting is not enforced yet, only reported

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The R package tested on three operating systems across three R versions, and
        # that discipline is part of the product here too. Trimmed to the ends of the
        # supported Python range off Linux, because torch is a slow download.
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create the environment
        run: uv venv --python ${{ matrix.python }}

      # A CUDA build is roughly 5 GB and there is no GPU on a runner. Installing torch
      # from the CPU index first leaves the requirement satisfied, so the package install
      # below will not pull the CUDA one. The index is given alone: combined with an
      # --extra-index-url, uv resolves torch from PyPI and the CUDA build arrives anyway.
      - name: Install CPU torch
        if: runner.os != 'macOS'
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package
        run: uv pip install -e ".[dev]"

      # --no-sync matters: a bare `uv run` re-resolves the environment from
      # pyproject.toml and reinstalls the CUDA torch that the step above deliberately
      # avoided, downloading about 4 GB to do it.
      - name: Run the tests
        run: uv run --no-sync pytest -q --durations=10

      - name: The schema still generates
        run: uv run --no-sync platypus-schema

      - name: Confirm the CPU build is what was tested
        run: uv run --no-sync python -c "import torch; assert torch.version.cuda is None or '${{ runner.os }}' == 'macOS', f'CUDA build {torch.version.cuda} leaked into CI'; print(torch.__version__)"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Check the metadata PyPI will see
        run: uvx twine check dist/*
      - name: Install the wheel somewhere clean and import it
        run: |
          uv venv --python 3.12 /tmp/check
          uv pip install --python /tmp/check/bin/python torch \
            --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/python -c "import pyplatypus; print(pyplatypus.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
