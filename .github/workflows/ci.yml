name: CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # First, because it is the cheapest and the one nothing else can see. A dependabot
      # PR moves a pin in pyproject.toml and leaves uv.lock alone, so `main` ends up
      # holding a lock that contradicts its own pin - and every other check here passes
      # anyway, because `uv run --only-group` resolves the pin rather than reading the
      # lock. That drift happened three times before this step existed and each time the
      # remedy was somebody remembering to relock.
      - run: uv lock --check

      # --only-group installs ruff alone, at the version pyproject.toml pins, so CI and
      # a contributor's machine cannot disagree about which rules apply.
      #
      # Both cover every tracked Python file - the package, the tests and the examples.
      # The examples are what a reader copies, so they are held to the same rules as the
      # code they demonstrate.
      #
      # The format step ran under `continue-on-error` for months, reporting 98 files on
      # every run and gating nothing, which is a step nobody reads. The whole tree was
      # formatted in one commit instead, so from here a diff is a decision somebody made.
      - run: uv run --only-group lint ruff check pyplatypus tests examples tools
      - run: uv run --only-group lint ruff format --check --diff pyplatypus tests examples tools

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The R package tested on three operating systems across three R versions, and
        # that discipline is part of the product here too. Trimmed to the ends of the
        # supported Python range off Linux, because torch is a slow download.
        #
        # The low end moved from 3.10 to 3.11 with `requires-python`, and the thing to know
        # before editing these numbers again is that **a job's name is what branch protection
        # matches**: three required contexts were called `test (<os>, 3.10)`, so dropping the
        # cells without renaming the contexts leaves every pull request waiting forever on a
        # check that is never coming - which looks exactly like a run that has not registered
        # yet. The contexts were renamed in the same breath as this list.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.13" }

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create the environment
        run: uv venv --python ${{ matrix.python }}

      # A CUDA build is roughly 5 GB and there is no GPU on a runner. Installing torch
      # from the CPU index first leaves the requirement satisfied, so the package install
      # below will not pull the CUDA one. The index is given alone: combined with an
      # --extra-index-url, uv resolves torch from PyPI and the CUDA build arrives anyway.
      #
      # torchvision comes from the same index and in the same command, never from PyPI
      # afterwards. It ships compiled operators built against one exact torch, so a
      # torchvision resolved separately loads and then raises
      # `operator torchvision::nms does not exist` the moment anything imports it - which
      # on this package means every test that touches a pretrained encoder, because timm
      # imports torchvision at module level. It is pulled in by the `encoders` extra, so
      # naming it here is what keeps the pair consistent.
      - name: Install CPU torch and torchvision
        if: runner.os != 'macOS'
        run: uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      # `hub` as well as `dev`: the Hub path in the weights registry is optional at runtime and
      # must not be optional in CI. Without it those tests skip, and a skipped test proves
      # nothing - the code would be shipped untested while the run stayed green.
      - name: Install the package
        run: uv pip install -e ".[dev,hub,encoders]"

      # --no-sync matters: a bare `uv run` re-resolves the environment from
      # pyproject.toml and reinstalls the CUDA torch that the step above deliberately
      # avoided, downloading about 4 GB to do it.
      - name: Run the tests
        run: uv run --no-sync pytest -q --durations=10

      - name: The schema still generates
        run: uv run --no-sync platypus-schema

      - name: Confirm the CPU build is what was tested
        run: uv run --no-sync python -c "import torch; assert torch.version.cuda is None or '${{ runner.os }}' == 'macOS', f'CUDA build {torch.version.cuda} leaked into CI'; print(torch.__version__)"

  # DELIBERATELY NOT A REQUIRED STATUS CHECK, and deliberately not `continue-on-error`
  # either - the comment on the format step above says what a step that gates nothing turns
  # into. This is a real job that goes red when it is wrong. What it does not do is block a
  # merge, because it can also go red for news rather than for a change: `lowest-direct`
  # resolves against whatever PyPI serves today, so a yanked old release reddens it with
  # nothing here having moved, and a required check that fails on somebody else's disclosure
  # blocks every merge until somebody else fixes it.
  #
  # WHAT IT IS FOR. Every `>=` in pyproject.toml is a claim about a version somebody can
  # install, and until this job nothing tested those claims. `0.8.0a43` is why it exists: the
  # pillow floor sat at `>=10.0` while the decoder advisories it was meant to answer were
  # fixed in 13.0.0, and `uv.lock` said 12.3.0 - because a lock is not a floor, and the
  # suite, CI and every scanner only ever saw the lock. Dependabot cannot see it either:
  # `increase-if-necessary` leaves a requirement alone when it already allows the new
  # release, which is the right strategy for a library and means a permissive floor is never
  # flagged. The exposure was in the unresolved range, and this is the only thing here that
  # resolves it.
  #
  # Python 3.11 rather than the matrix, because it is the lowest `requires-python` admits: the
  # job is then the worst case a user can assemble, oldest interpreter with oldest
  # dependencies, rather than one more cell of the ordinary one.
  floors:
    name: floors (lowest-direct)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create the environment on the oldest interpreter the manifest admits
        run: uv venv --python 3.11

      # The same CPU-index reasoning as the test job above, with `--resolution lowest-direct`
      # so this is the oldest torch the floor permits rather than the newest it allows.
      - name: Install the lowest torch and torchvision the floors permit, CPU build
        run: uv pip install --resolution lowest-direct torch torchvision --index-url https://download.pytorch.org/whl/cpu

      # `[hub,encoders]` but NOT `dev`, and the first run of this job is why. The claim being
      # tested is about what the package NEEDS - `huggingface_hub` and `timm` are part of that,
      # the test tooling is not. `dev` holds `pytest-cov`, `build` and `twine` with no floors
      # at all, so `lowest-direct` took them to 0.6, 0.0.1 and 1.0.1: versions nobody has
      # claimed anything about, in a job whose whole subject is claims.
      - name: Install the package at its declared floors
        run: uv pip install --resolution lowest-direct -e ".[hub,encoders]"

      # After, and at the ordinary resolution, so the tooling is not part of the measurement.
      - name: Install the test tooling, which is not what this job is about
        run: uv pip install pytest pytest-cov

      # BEFORE the tests, not after. When this job goes red the first question is which
      # versions it was red about, and a failed test run does not answer that. The list is
      # read off the installed distribution's own `Requires-Dist` rather than written out
      # here, because a second copy of the dependency list is one more thing to drift.
      - name: What the floors actually resolved to
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata as m, re
          seen = []
          for raw in m.requires("pyplatypus") or []:
              name = re.split(r"[\s\[<>=!;(]", raw, 1)[0]
              if name in seen:
                  continue
              seen.append(name)
              try:
                  print(f"  {name:22s} {m.version(name)}")
              except m.PackageNotFoundError:
                  print(f"  {name:22s} not installed - an extra this job did not select")
          PY

      - name: Run the tests against the floors
        run: uv run --no-sync pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Check the metadata PyPI will see
        run: uvx twine check dist/*
      - name: Install the wheel somewhere clean and import it
        run: |
          uv venv --python 3.12 /tmp/check
          uv pip install --python /tmp/check/bin/python torch \
            --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/python -c "import pyplatypus; print(pyplatypus.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

      # The release workflow hands the built distributions between jobs through an
      # artifact, and download-artifact appears nowhere else - so a bump to that action
      # used to arrive with a green tick from ten jobs, none of which executed a single
      # line of it, and would only be found by a failed release. Doing the round trip
      # here puts it on the tested path.
      #
      # Deleting dist/ first matters: without it the checks below would pass on the
      # files the build step left behind, whatever the download actually produced.
      - name: Discard the built files, so only the artifact can satisfy what follows
        run: rm -rf dist
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: The distributions survived the round trip intact
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -l dist/
          wheels=(dist/*.whl); sdists=(dist/*.tar.gz)
          test ${#wheels[@]} -eq 1 || { echo "expected 1 wheel, found ${#wheels[@]}"; exit 1; }
          test ${#sdists[@]} -eq 1 || { echo "expected 1 sdist, found ${#sdists[@]}"; exit 1; }
          # Still real archives, not a zip of a zip: exactly what changed in
          # download-artifact v8, which stopped unconditionally decompressing.
          python -c "import sys, zipfile; sys.exit(0 if zipfile.is_zipfile('${wheels[0]}') else 1)"
          python -c "import sys, tarfile; sys.exit(0 if tarfile.is_tarfile('${sdists[0]}') else 1)"
          uvx twine check dist/*
