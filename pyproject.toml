[project]
name = "pyplatypus"
version = "0.2.0.dev0"
description = "Computer vision for medical imaging: the engine behind the platypus R package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michal Maj", email = "michalmaj116@gmail.com" }]

# torch arrives in step 3, huggingface_hub with the weights registry. The data
# layer is deliberately numpy-only so it stays fast to test and reusable.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "albumentations>=1.4",
    # Pinned to the CUDA 12.x line on purpose. torch 2.8+/cu13x dropped the whole Pascal
    # family, which kills the author's GTX 1070 outright - see spike/FINDINGS.md stage 2.
    # Loosen this only after checking what CUDA build the new version ships.
    "torch>=2.7,<2.8",
]

[project.scripts]
platypus-schema = "pyplatypus.spec.schema:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyplatypus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
