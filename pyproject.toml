[project]
name = "pyplatypus"
version = "0.3.0a5"
description = "Computer vision for medical imaging: the engine behind the platypus R package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michal Maj", email = "michalmaj116@gmail.com" }]
keywords = [
    "computer-vision",
    "segmentation",
    "medical-imaging",
    "u-net",
    "pytorch",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "pydicom>=3.0",
    # NIfTI is how research volumes travel - the Decathlon, BraTS, most of TCIA's derived
    # sets. Small and pure Python, so it is a hard dependency rather than an extra: a
    # medical imaging package that cannot open a .nii.gz is not one.
    "nibabel>=5.2",
    "albumentations>=1.4",
    # No upper bound on purpose. torch 2.8+ ships CUDA 13 builds, which dropped the
    # Maxwell, Pascal and Volta generations - a GTX 10-series card needs a CUDA 12.x
    # build and therefore torch 2.7.x. That is a property of somebody's hardware, not of
    # this package, so it lives in the `pascal` extra instead of being forced on everyone.
    "torch>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov", "build", "twine"]
# For a Pascal-generation GPU (GTX 10-series): the last torch built against CUDA 12.
pascal = ["torch>=2.7,<2.8"]

# The linter's version is declared here and nowhere else. It used to be pinned in the CI
# workflow while the dev extra said `ruff>=0.6`, so a contributor could run `ruff check`
# clean locally and still be told off by CI - ruff adds and changes rules between minor
# releases, and 0.6 to 0.16 is a lot of them.
#
# A dependency group rather than an extra, because `uv run --only-group lint` installs
# ruff and nothing else: the linter has no business pulling torch down to look at text.
#
#     uv run --only-group lint ruff check pyplatypus tests
#
[dependency-groups]
lint = ["ruff==0.16.8"]

[project.scripts]
platypus-schema = "pyplatypus.spec.schema:main"

[project.urls]
Homepage = "https://github.com/maju116/pyplatypus"
Repository = "https://github.com/maju116/pyplatypus"
Issues = "https://github.com/maju116/pyplatypus/issues"
"R package" = "https://github.com/maju116/platypus"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyplatypus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `tests` an importable package root, so a test can pull a shared helper out of
# tests/conftest.py. Without it that import works locally, where `python -m pytest` puts
# the working directory on sys.path, and fails everywhere else - which is how CI found it.
pythonpath = ["."]

[tool.ruff]
line-length = 100
