[project]
name = "pyplatypus"
version = "0.8.0a57"
description = "Computer vision for medical imaging: the engine behind the platypus R package."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michal Maj", email = "michalmaj116@gmail.com" }]
keywords = [
    "computer-vision",
    "segmentation",
    "medical-imaging",
    "u-net",
    "pytorch",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.24",
    # The floor is 13 rather than 10 because of what a floor is FOR: the lock file governs
    # this repository's own environment, and what a USER resolves is this line. Pillow 13.0.0
    # is where a batch of decoder advisories against every earlier release is fixed, and a
    # user holding 10.x satisfied `>=10.0` and got all of them. One break comes with it and it
    # is somebody else's rather than ours: 13 removed `mode=` as a data-type converter in
    # `fromarray`, which every call site here already avoids by passing a mode matching its
    # dtype.
    #
    # This was two lines with a marker for one release, because pillow 13 requires Python
    # >= 3.11 and `uv` refuses to resolve a plain `>=13` against `requires-python = ">=3.10"`
    # at all. That is what `requires-python` above answered: the floor is one line again, and
    # the thing that made it two is gone rather than worked around.
    "pillow>=13",
    "pydicom>=3.0",
    # NIfTI is how research volumes travel - the Decathlon, BraTS, most of TCIA's derived
    # sets. Small and pure Python, so it is a hard dependency rather than an extra: a
    # medical imaging package that cannot open a .nii.gz is not one.
    "nibabel>=5.2",
    # Weights are read and written as safetensors, never pickle: a pickle executes code when
    # it is loaded, so a weights file would be a program somebody else wrote. Tiny.
    "safetensors>=0.4",
    # The floor is 1.4.23 and every digit of it was measured. `>=1.4` was fiction: resolved
    # at the floor, the suite gives 50 failures, 28 of them one line -
    # `Compose.__init__() got an unexpected keyword argument 'seed'`. `seed=` is what
    # `deterministic = True` is built on, so the floor was permitting a version that cannot
    # honour this package's own determinism promise, whose help page says the refusal without
    # a seed is deliberate. Bisected rather than rounded up, because `>=2.0` is the easy
    # answer and narrows what a user may install by 24 releases:
    #
    #     1.4.0    no seed=, no D4, no CenterCrop3D     the floor as it stood
    #     1.4.18   D4 only
    #     1.4.21   seed= and D4, still no 3D transforms
    #     1.4.23   all three - the first version this package's code can run on
    #
    # `>=2.0` was tried here for one commit and **bought nothing**, which is why it is not
    # the floor: the same four tests fail at 2.0.0 as at 1.4.23, one of them to the digit
    # (`1.5301895141601562` of warp slack either way), so albumentations is not that test's
    # variable. Three of the four pin albumentations' transform INVENTORY through a number in
    # a docstring - 118, against 113 at 1.4.23, 114 at 2.0.0 and 118 at 2.0.8 - so satisfying
    # them would make the floor `==2.0.8`, which is a pin and not a floor. That is a defect in
    # those tests rather than in this number, and it is where the work goes next.
    "albumentations>=1.4.23",
    # The signed distance transform the `boundary` loss is built on. Present anyway -
    # albumentations requires it - but a package whose code imports scipy should say so
    # rather than rely on somebody else's dependency list not changing.
    "scipy>=1.10",
    # The marker-controlled watershed that turns a separation signal into instances.
    # `scipy.ndimage.watershed_ift` is not a substitute: it wants integer markers and
    # implements the image-foresting-transform watershed, a different algorithm from the one
    # the instance-segmentation literature means by the name. Hard rather than an extra for
    # the reason `scipy` is, plus one more: every published comparison on this problem uses
    # `skimage.segmentation.watershed`, so writing our own would make a difference from the
    # literature indistinguishable from a bug in ours. Under 2% of torch, which is the line
    # the `hub` and `encoders` extras were decided on.
    "scikit-image>=0.22",
    # Hard rather than an extra, and the number is why: the wheel is 9.9 MB and its own
    # dependencies are small or already here, so with everything it is 15-20 MB against
    # torch's 555 MB - about 3%. The rule already applied to `hub` and `encoders` was that
    # under 2% of torch is not a trade worth making anyone opt into; this is the same
    # bracket. And the examples *are* the documentation: a figure behind an extra is a
    # figure most readers never see, which is exactly how the weights registry once could
    # not work from R at all.
    "matplotlib>=3.7",
    # No upper bound on purpose. torch 2.8+ ships CUDA 13 builds, which dropped the
    # Maxwell, Pascal and Volta generations - a GTX 10-series card needs a CUDA 12.x
    # build and therefore torch 2.7.x. That is a property of somebody's hardware, not of
    # this package, so it lives in the `pascal` extra instead of being forced on everyone.
    "torch>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov", "build", "twine"]
# For a Pascal-generation GPU (GTX 10-series): the last torch built against CUDA 12.
pascal = ["torch>=2.7,<2.8"]
# Only needed to fetch published weights by name. Most runs never do, and an air-gapped
# install cannot, so it is not part of the base install.
hub = ["huggingface_hub>=0.30"]
# Pretrained encoders: `encoder = "resnet34"`. timm supplies the backbone architectures and
# their ImageNet weights. An extra rather than a dependency because our own encoder needs
# none of it, it is the only encoder that works in 3D, and timm is not small.
#
# timm also pulls in torchvision, which pins itself tightly to a torch version, so this extra
# can drag torch forward: installing it alone on a Pascal card resolved torch to a CUDA 13
# build and the GPU silently disappeared. On that hardware ask for both -
# `pip install "pyplatypus[encoders,pascal]"` - which resolves to torch 2.7.1 and
# torchvision 0.22.1. Verified, not assumed.
encoders = ["timm>=1.0"]

# The linter's version is pinned here because ruff adds and changes rules between minor
# releases: it used to be pinned in the CI workflow while the dev extra said `ruff>=0.6`, so
# a contributor could run `ruff check` clean locally and still be told off by CI, and 0.6 to
# 0.16 is a lot of rules.
#
# THIS IS NOT THE ONLY COPY, and the comment here said it was until 2026-10-26. The R package
# has no pyproject to read this number from, so `.github/workflows/R-CMD-check.yaml` writes it
# twice as `uvx ruff@<version>` over `inst/python`, the one Python file that package ships -
# and nothing holds the two together. Moving this line and not that one leaves the two
# repositories linting the same language by different rules, silently, until a rule that
# changed between the versions fires on one side. That is what the pin exists to prevent, and
# the cross-repository half of it is a gap rather than a guard: it is listed as such in the
# workbench's §3F table, with what a test would be.
#
# So a bump here travels with `rplatypus`'s workflow in the same sitting. 0.16.10 to 0.17.2 on
# 2026-10-26 was the first one to land and it cost nothing - the shim is clean under both - but
# the next one will not announce itself either.
#
# A dependency group rather than an extra, because `uv run --only-group lint` installs
# ruff and nothing else: the linter has no business pulling torch down to look at text.
#
#     uv run --only-group lint ruff check pyplatypus tests
#
[dependency-groups]
lint = ["ruff==0.17.2"]

[project.scripts]
platypus-schema = "pyplatypus.spec.schema:main"

[project.urls]
Homepage = "https://github.com/maju116/pyplatypus"
Repository = "https://github.com/maju116/pyplatypus"
Issues = "https://github.com/maju116/pyplatypus/issues"
"R package" = "https://github.com/maju116/rplatypus"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyplatypus*"]

[tool.pytest.ini_options]
# `pyplatypus` is here so the doctests run beside the tests. It must be a testpath rather
# than an argument in `addopts`: an argument there *replaces* the testpaths, which took the
# suite from 1249 tests to 10 doctests and still printed "passed".
testpaths = ["tests", "pyplatypus"]
# Makes `tests` an importable package root, so a test can pull a shared helper out of
# tests/conftest.py. Without it that import works locally, where `python -m pytest` puts
# the working directory on sys.path, and fails everywhere else - which is how CI found it.
pythonpath = ["."]
# Doctests in the package are the examples the documentation shows, so they have to run.
# ELLIPSIS lets an error message be matched by its opening words rather than restated in
# full - a message is prose and will be improved. IGNORE_EXCEPTION_DETAIL matches the
# exception type without its text, for the same reason.
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL", "NORMALIZE_WHITESPACE"]
# The examples in the docstrings are the examples the documentation shows, so they run with
# the suite rather than being read by nobody. They earned this on the first afternoon: five
# claims written straight into `Args` and `Returns` were false - the wrong key name, the
# wrong return shape, the wrong CSV header - and every one would have shipped as prose.
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
